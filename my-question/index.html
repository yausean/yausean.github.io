<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd43b">
<meta name="description" content="Scan, tap, and get a random ice-breaker question.">
<title>My question is…</title>
<style>
:root{
  --sun:#ffd43b; --ink:#1d1b3a; --coral:#ff5d73; --teal:#19c5b5; --paper:#fffdf5;
  --accent:#ff5d73;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;
  color:var(--ink); font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  min-height:100dvh; overflow:hidden;
  background:
    radial-gradient(circle at 12% 14%, #ff9f1c 0 70px, transparent 71px),
    radial-gradient(circle at 92% 8%, #ff5d73 0 46px, transparent 47px),
    radial-gradient(circle at 88% 90%, #19c5b5 0 96px, transparent 97px),
    radial-gradient(circle at 6% 86%, #7b5cff 0 54px, transparent 55px),
    radial-gradient(#ffe680 2.5px, transparent 3px) 0 0/26px 26px,
    var(--sun);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #7b5cff;outline-offset:4px}

.view{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.view.on{display:flex}

/* ---------- Home ---------- */
h1{margin:0 0 6px;font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:-.03em;text-align:center;line-height:1.05}
.sub{margin:0 0 22px;font-size:17px;font-weight:700;text-align:center;opacity:.8}
.qr{
  width:min(68vw,300px,42dvh); aspect-ratio:1; padding:14px; background:#fff;
  border:5px solid var(--ink); border-radius:28px; box-shadow:8px 8px 0 var(--ink);
  transform:rotate(-2deg); animation:float 4s ease-in-out infinite;
}
.qr svg{display:block;width:100%;height:100%}
.big{
  margin-top:34px; padding:18px 34px; font-size:clamp(22px,6.4vw,30px); font-weight:900; letter-spacing:-.02em;
  color:#fff; background:var(--coral); border:5px solid var(--ink); border-radius:999px;
  box-shadow:0 8px 0 var(--ink); transition:transform .08s, box-shadow .08s;
  animation:nudge 2.4s ease-in-out infinite;
}
.big:active,.pill:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink);animation:none}

/* ---------- Play ---------- */
.bar{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.pill{
  padding:10px 18px; font-size:17px; font-weight:900; background:var(--paper);
  border:4px solid var(--ink); border-radius:999px; box-shadow:0 5px 0 var(--ink);
  transition:transform .08s, box-shadow .08s, opacity .2s;
}
#regen{background:var(--teal);color:#fff}
#regen[disabled]{opacity:0;pointer-events:none}
#regen .spin{display:inline-block;margin-right:4px}
#regen:not([disabled]):hover .spin{animation:turn .6s ease}

.stage{position:relative;width:100%;max-width:560px;min-height:360px;display:flex;align-items:center;justify-content:center}

.bouncer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:40px}
.rolling .bouncer{display:flex}
.ball{
  width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:58px;
  background:radial-gradient(circle at 32% 28%, #fff 0 9%, transparent 10%), var(--accent);
  border:5px solid var(--ink); transform-origin:50% 100%;
  animation:bounce .4s cubic-bezier(.5,0,.9,.6) infinite alternate;
}
.shadow{width:110px;height:16px;margin-top:6px;border-radius:50%;background:rgba(29,27,58,.28);
  animation:shadow .4s cubic-bezier(.5,0,.9,.6) infinite alternate}
.wait{margin:18px 0 0;font-size:20px;font-weight:900}
.wait i{font-style:normal;display:inline-block;animation:dot 1s infinite}
.wait i:nth-child(2){animation-delay:.15s}.wait i:nth-child(3){animation-delay:.3s}

.card{
  display:none; width:100%; padding:30px 26px 34px; text-align:center; background:var(--paper);
  border:5px solid var(--ink); border-radius:32px; box-shadow:10px 10px 0 var(--accent), 10px 10px 0 5px var(--ink);
}
.shown .card{display:block;animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
.emoji{font-size:72px;line-height:1;display:inline-block;animation:wiggle 1.6s ease-in-out .5s infinite}
.tag{display:inline-block;margin:16px 0 12px;padding:5px 14px;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  color:#fff;background:var(--accent);border:3px solid var(--ink);border-radius:999px}
.q{margin:0;font-size:clamp(26px,7vw,38px);font-weight:900;line-height:1.18;letter-spacing:-.025em;text-wrap:balance}

.confetti{position:fixed;left:50%;top:45%;width:12px;height:16px;border-radius:3px;pointer-events:none;z-index:5;
  animation:fly 1.1s cubic-bezier(.1,.7,.3,1) forwards}

@keyframes float{50%{transform:rotate(2deg) translateY(-8px)}}
@keyframes nudge{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-3deg) scale(1.04)}92%{transform:rotate(3deg) scale(1.04)}96%{transform:rotate(-2deg)}}
@keyframes bounce{0%{transform:translateY(-190px) scale(.96,1.04)}82%{transform:translateY(0) scale(1)}100%{transform:translateY(0) scale(1.22,.76)}}
@keyframes shadow{0%{transform:scale(.45);opacity:.35}100%{transform:scale(1.15);opacity:1}}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){
  .qr,.big,.emoji,.ball,.shadow,.wait i{animation:none}
  .shown .card{animation:none}
}
</style>
</head>

    home.classList.remove('on');play.classList.add('on');
    regen.disabled=true;
    var q=pick();
    if(calm){reveal(q);return}
    stage.className='stage rolling';
    var n=0;
    function face(){var f=QUESTIONS[n++%QUESTIONS.length];ball.textContent=f.e;root.style.setProperty('--accent',f.c)}
    face();ticker=setInterval(face,400);
    timer=setTimeout(function(){reveal(q)},2400);
  }

  function reveal(q){
    stop();
    root.style.setProperty('--accent',q.c);
    $('emoji').textContent=q.e;$('q').textContent=q.t;
    stage.className='stage';void stage.offsetWidth;stage.className='stage shown';
    regen.disabled=false;
    if(!calm)burst();
  }

  function burst(){
    for(var i=0;i<36;i++){
      var p=document.createElement('span'),a=Math.random()*Math.PI*2,d=140+Math.random()*260;
      p.className='confetti';
      p.style.background=CONFETTI[i%CONFETTI.length];
      p.style.setProperty('--x',Math.cos(a)*d+'px');
      p.style.setProperty('--y',(Math.sin(a)*d+120)+'px');
      p.style.setProperty('--r',(Math.random()*720-360)+'deg');
      document.body.appendChild(p);
      p.addEventListener('animationend',function(){this.remove()});
    }
  }

  $('start').addEventListener('click',roll);
  regen.addEventListener('click',roll);
  $('back').addEventListener('click',function(){stop();play.classList.remove('on');home.classList.add('on');root.style.removeProperty('--accent')});
})();
</script>
</body>
</html>
